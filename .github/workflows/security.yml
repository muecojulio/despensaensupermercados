name: Seguridad

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Auditoría de dependencias y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Preparar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Pruebas de seguridad
        run: npm run test:security
      - name: Revisar vulnerabilidades conocidas
        run: npm audit --audit-level=low
